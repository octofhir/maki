[package]
name = "maki-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core MAKI engine for parsing, linting, and analyzing FHIR Shorthand (FSH) projects"

[dependencies]
chumsky = { workspace = true }
ariadne = { workspace = true }
rowan = { workspace = true }
biome_text_size = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
json5 = "1.3"                                     # JSONC support (comments + trailing commas)
schemars = "1.2"                                  # JSON Schema generation
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
semver = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
notify = { workspace = true }
dashmap = { workspace = true }
octofhir-canonical-manager = { workspace = true }
regex = "1.13"
is-terminal = "0.4"
indexmap = "2.14"                                  # Ordered HashMap for preserving insert order
petgraph = "0.8"                                  # Graph data structure and algorithms
indicatif = "0.18"                                # Progress bars and spinners

# Terminal/console output
term_size = "0.3"     # Terminal width detection
unicode-width = "0.2" # Unicode character width calculation

# Diff rendering
similar = { version = "3.2", features = [
  "inline",
] } # Text diffing for suggestions

[dev-dependencies]
octofhir-canonical-manager = { workspace = true, features = ["test-utils"] }
criterion = { workspace = true }
insta = { workspace = true }
tokio-test = "0.4"
tempfile = "3.27"
wiremock = "0.6"
flate2 = "1.1"
tar = "0.4"
