[package]
name = "maki-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core MAKI engine for parsing, linting, and analyzing FHIR Shorthand (FSH) projects"

[features]
default = ["project"]
# Complete project analysis, package loading, export and filesystem integrations.
project = [
    "dep:serde_yaml",
    "dep:tokio",
    "dep:async-trait",
    "dep:futures",
    "dep:rayon",
    "dep:tracing-subscriber",
    "dep:semver",
    "dep:walkdir",
    "dep:glob",
    "dep:notify",
    "dep:octofhir-canonical-manager",
    "dep:indexmap",
    "dep:petgraph",
    "dep:indicatif",
]

[dependencies]

rowan = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }

schemars = "1.2"                                  # JSON Schema generation
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
thiserror = { workspace = true }
semver = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
dashmap = { workspace = true }
octofhir-canonical-manager = { workspace = true, optional = true }
regex = "1.13"

# Ordered HashMap for preserving insert order
indexmap = { version = "2.14", optional = true }
# Graph data structure and algorithms
petgraph = { version = "0.8", optional = true }
# Progress bars and spinners
indicatif = { version = "0.18", optional = true }

# Terminal/console output
terminal_size = "0.4.4"     # Terminal width detection
unicode-width = "0.2" # Unicode character width calculation

# Diff rendering
similar = { version = "3.2", features = [
  "inline",
] } # Text diffing for suggestions

[dev-dependencies]
octofhir-canonical-manager = { workspace = true, features = ["test-utils"] }
criterion = { workspace = true }
insta = { workspace = true }
tokio-test = "0.4"
tempfile = "3.27"
wiremock = "0.6"
flate2 = "1.1"
tar = "0.4"
